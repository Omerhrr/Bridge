# Bridge — Render deployment (spec section 35)
# Frontend (Nuxt) + Backend (FastAPI) + PostgreSQL
#
# After the first Blueprint sync, fill in the `sync: false` values in the
# Render dashboard (AT_API_KEY, NUXT_API_TARGET, CORS_ORIGINS).
services:
  # FastAPI backend — receives public HTTPS webhooks from Africa's Talking
  - type: web
    name: bridge-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bridge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "true"
      - key: CORS_ORIGINS
        sync: false # e.g. https://bridge.rogan.live,https://bridge-frontend.onrender.com
      - key: AT_USERNAME
        value: sandbox
      - key: AT_API_KEY
        sync: false
      - key: AT_PHONE_NUMBER
        sync: false
      - key: AT_SENDER_ID
        sync: false
      - key: AT_SHORTCODE
        sync: false # sandbox shortcode people text, e.g. 57000
      - key: AT_SANDBOX
        value: "true"
      - key: AI_PROVIDER
        value: deepseek
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false

  # Nuxt frontend — dashboard and visual workflow builder.
  # The browser only ever calls same-origin /api/v1/...; the Nitro route in
  # server/routes/api/[...path].ts forwards those calls to NUXT_API_TARGET.
  - type: web
    name: bridge-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NUXT_API_TARGET
        sync: false # public URL of bridge-api, e.g. https://bridge-api.onrender.com

databases:
  - name: bridge-db
    plan: free
    databaseName: bridge
    user: bridge
