# Bridge — Render deployment (spec section 35)
# Frontend (Nuxt) + Backend (FastAPI) + PostgreSQL
services:
  # FastAPI backend — receives public HTTPS webhooks from Africa's Talking
  - type: web
    name: bridge-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: BRIDGE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bridge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # e.g. https://bridge-frontend.onrender.com
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_PHONE_NUMBER
        sync: false
      - key: AT_SENDER_ID
        sync: false
      - key: AT_SANDBOX
        value: "true"
      - key: AI_PROVIDER
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false

  # Nuxt frontend — dashboard and visual workflow builder
  - type: web
    name: bridge-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NUXT_PUBLIC_API_BASE
        sync: false # e.g. https://bridge-api.onrender.com/api/v1

databases:
  - name: bridge-db
    databaseName: bridge
    user: bridge
